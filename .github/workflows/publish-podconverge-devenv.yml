name: PodConverge DevEnv Publisher

on:
  push:
    branches:
      - "sync/penpot-*"
    paths:
      - "docker/devenv/**"
      - ".github/workflows/publish-podconverge-devenv.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and publish PodConverge DevEnv
    runs-on: ubuntu-latest

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish DevEnv
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./docker/devenv/
          file: ./docker/devenv/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/podconverge-organization/pod-design-stadio-devenv:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/PodConverge-Organization/pod-design-stadio
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Report published image
        run: |
          {
            echo "### PodConverge DevEnv image"
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- SHA-tagged image: \`ghcr.io/podconverge-organization/pod-design-stadio-devenv:${GITHUB_SHA}\`"
            echo "- Immutable image@sha256 digest: \`ghcr.io/podconverge-organization/pod-design-stadio-devenv@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
