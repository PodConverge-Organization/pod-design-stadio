location = /api/rpc/command/create-file-media-object-from-url {
    proxy_pass http://127.0.0.1:9001$request_uri;
    proxy_http_version 1.1;

    # standard client headers
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Scheme        $scheme;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Increase timeouts for long-running uploads/downloads/processing
    proxy_connect_timeout 200s;
    proxy_send_timeout    200s;
    proxy_read_timeout    200s;
    send_timeout          200s;

    # Don't buffer upstream response — stream it back to client
    proxy_buffering off;
    # Stream client request body to upstream (useful for large bodies)
    proxy_request_buffering off;

    # Avoid caching and redirects handling
    proxy_cache off;
    proxy_redirect off;

    # allow larger uploads just in case (adjust to your needs)
    client_max_body_size 100m;

    # Optional: keep connection header default/empty to allow streaming
    proxy_set_header Connection "";

    # Add a small custom header so you can spot the proxied requests in backend logs (optional)
    add_header X-Proxied-By "nginx-proxies.conf" always;
}


location ~ ^/github/penpot-files/(.+)$ {
    rewrite ^/github/penpot-files/(.+) /penpot/penpot-files/refs/heads/main/$1 break;
    proxy_pass https://raw.githubusercontent.com;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Cookies;
    proxy_set_header User-Agent "curl/8.5.0";
    proxy_set_header Host "raw.githubusercontent.com";
    proxy_set_header Accept "*/*";
    add_header Access-Control-Allow-Origin $http_origin;
    proxy_buffering off;
}

location ~ ^/internal/gfonts/font/(?<font_file>.+) {
    proxy_pass https://fonts.gstatic.com/s/$font_file;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Link;
    proxy_hide_header Alt-Svc;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Report-To;

    proxy_ignore_headers Set-Cookie Vary Cache-Control Expires;

    proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/113.0.0.0 Safari/537.36";
    proxy_set_header Host "fonts.gstatic.com";
    proxy_set_header Accept "*/*";

    proxy_cache penpot;

    add_header Access-Control-Allow-Origin $http_origin;
    add_header Cache-Control max-age=86400;
    add_header X-Cache-Status $upstream_cache_status;
}

location ~ ^/internal/gfonts/css {
    proxy_pass https://fonts.googleapis.com/css?$args;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Link;
    proxy_hide_header Alt-Svc;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;

    proxy_ignore_headers Set-Cookie Vary Cache-Control Expires;

    proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/113.0.0.0 Safari/537.36";
    proxy_set_header Host "fonts.googleapis.com";
    proxy_set_header Accept "*/*";

    proxy_cache penpot;

    add_header Access-Control-Allow-Origin $http_origin;
    add_header Cache-Control max-age=86400;
    add_header X-Cache-Status $upstream_cache_status;
}
